<!DOCTYPE html>
<html>
<head>
    <title>Pricing Plans</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 30px;
        }

        .card {
            background: white;
            border: 2px solid gray;
            padding: 25px;
            width: 200px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 5px 15px gray;
        }

        .popular {
            border: 3px solid blue;
        }

        button {
            background: navy;
            color: white;
            padding: 10px 20px;
            border: none;
        }
    </style>
</head>
<body>

<h1>Our Pricing Plans</h1>

<div class="container">

    <div class="card">
        <h2>Basic</h2>
        <h3>₹199</h3>
        <p>Basic Features</p>
        <button>Choose Plan</button>
    </div>

    <div class="card popular">
        <h2>Popular</h2>
        <h3>₹499</h3>
        <p>All Standard Features</p>
        <b>Most Popular</b><br><br>
        <button>Choose Plan</button>
    </div>

    <div class="card">
        <h2>Premium</h2>
        <h3>₹999</h3>
        <p>All Features</p>
        <button>Choose Plan</button>
    </div>

</div>

</body>
</html>
