<!DOCTYPE html>
<html>
<head>
    <title>Modal Popup</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }

        .content {
            background: white;
            padding: 30px;
            width: 250px;
            border-radius: 10px;
        }

        .close {
            float: right;
            cursor: pointer;
            font-size: 25px;
        }
    </style>
</head>
<body>

<h1>Modal Popup Example</h1>

<button onclick="openModal()">Open Popup</button>

<div class="modal" id="modal">

    <div class="content">
        <span class="close" onclick="closeModal()">×</span>

        <h2>Hello!</h2>
        <p>This is a modal popup window.</p>
    </div>

</div>

<script>
    function openModal() {
        document.getElementById("modal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("modal").style.display = "none";
    }

    window.onclick = function(event) {
        let modal = document.getElementById("modal");

        if (event.target == modal) {
            closeModal();
        }
    };
</script>

</body>
</html>
