<!DOCTYPE html>
<html>
<head>
    <title>Project Search Filter</title>

    <style>
        body {
            font-family: Arial;
            background: lightgray;
            text-align: center;
            padding: 20px;
        }

        input {
            padding: 12px;
            width: 250px;
            margin: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .card {
            background: white;
            padding: 25px;
            width: 180px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<h1>My Projects</h1>

<input type="text" id="search" placeholder="Search Projects">

<div class="container" id="projects">

    <div class="card">Portfolio Website</div>

    <div class="card">Library System</div>

    <div class="card">Student Management</div>

    <div class="card">Calculator</div>

</div>

<script>
    let search = document.getElementById("search");

    search.addEventListener("input", function() {

        let value = search.value.toLowerCase();

        let cards = document.querySelectorAll(".card");

        cards.forEach(function(card) {

            let name = card.innerText.toLowerCase();

            if (name.includes(value)) {
                card.style.display = "block";
            }
            else {
                card.style.display = "none";
            }

        });

    });
</script>

</body>
</html>
