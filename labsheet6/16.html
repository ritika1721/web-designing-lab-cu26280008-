<!DOCTYPE html>
<html>
<head>
    <title>Product Features</title>

    <style>
        body {
            font-family: Arial;
            background: lightgray;
            text-align: center;
            padding: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .feature {
            background: white;
            padding: 25px;
            width: 200px;
            border-radius: 10px;
        }

        .icon {
            font-size: 40px;
        }
    </style>
</head>
<body>

<h1>Our Product Features</h1>

<div class="container">

    <div class="feature">
        <div class="icon">⚡</div>
        <h2>Fast</h2>
        <p>Quick Performance</p>
    </div>

    <div class="feature">
        <div class="icon">🔒</div>
        <h2>Secure</h2>
        <p>Your Data is Safe</p>
    </div>

    <div class="feature">
        <div class="icon">📱</div>
        <h2>Responsive</h2>
        <p>Works on All Devices</p>
    </div>

</div>

</body>
</html>
