<!DOCTYPE html>
<html>
<head>
    <title>Social Media Footer</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            text-align: center;
        }

        footer {
            background: navy;
            color: white;
            padding: 30px;
            margin-top: 200px;
        }

        .social {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .social a {
            color: white;
            text-decoration: none;
            padding: 10px;
            border: 1px solid white;
            transition: 0.3s;
        }

        .social a:hover {
            background: orange;
            color: black;
        }
    </style>
</head>
<body>

<h1>Welcome to My Website</h1>

<footer>
    <h2>Follow Us</h2>

    <div class="social">
        <a href="https://facebook.com">Facebook</a>
        <a href="https://instagram.com">Instagram</a>
        <a href="https://linkedin.com">LinkedIn</a>
    </div>

    <p>Copyright 2026 My Website</p>
</footer>

</body>
</html>
